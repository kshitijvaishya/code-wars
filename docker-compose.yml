version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cw-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: codewars

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cw-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://cw-mongodb:27017/codewars
      PISTON_BASE_URL: https://emkc.org/api/v2/piston
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cw-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongodb_data:
