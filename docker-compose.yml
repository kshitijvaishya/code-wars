version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cw-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: codewars

  judge0:
    image: judge0/judge0:1.13.1
    container_name: cw-judge0
    restart: unless-stopped
    ports:
      - '2358:2358'
    privileged: true
    environment:
      REDIS_URL: redis://cw-redis:6379
      POSTGRES_HOST: cw-judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
    depends_on:
      - cw-judge0-db
      - cw-redis

  cw-judge0-db:
    image: postgres:16-alpine
    container_name: cw-judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
    volumes:
      - judge0_db:/var/lib/postgresql/data

  cw-redis:
    image: redis:7-alpine
    container_name: cw-redis
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cw-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://cw-mongodb:27017/codewars
      JUDGE0_BASE_URL: http://cw-judge0:2358
    depends_on:
      - mongodb
      - judge0

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cw-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongodb_data:
  judge0_db:
